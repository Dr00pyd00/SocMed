<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>HomePage</title>
</head>
<body>

    <h1>Homepage</h1>

    {% if user.is_authenticated %}
    <p>Welcome {{ user }}</p>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">logout.</button>
    </form>
{% else %}
    <p>You not login...</p>
    <a href="{% url 'login' %}">login.</a>
{% endif %}

    
</body>
</html>
