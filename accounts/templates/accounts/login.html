
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

    <h1>Login Page</h1>

    {% if form.non_field_errors %}
        <p style="color: red;">{{ form.non_field_errors }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {{ form.as_p }}
        <button type="submit">Login!</button>
    </form>


{% endblock %}
