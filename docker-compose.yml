
services:

# la database ====================================================
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - socmed_volume:/var/lib/postgresql/data

    ports:
      # hote:container
      # donc port sur la machine / port coter container
      - "127.0.0.1:5555:5432"

      # mettre un healthy: s'assurer que ce service soit lancer avant la suite CAR "depends_on" attend juste que le service ce LANCE:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]  # test livrer avec l'image officielle de psql
      interval: 2s  # test toutes les 2 secs
      timeout: 5s   # abandonne l'essai si jamais ca bloque plus de 5 sec
      retries: 5

# django ==========================================================
  web:
    build: .
    env_file: 
      - .env
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


# nginx ===========================================================

  nginx:
    image: nginx:1.27
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      web:
        condition: service_healthy


# declaration de volumes:
volumes:
  socmed_volume:
  media_volume:
  static_volume:

