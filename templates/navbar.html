

<nav class="navbar">
    <div class="navbar-left">
        <a href="{% url 'home' %}" class="navbar-brand">SocMed</a>
    </div>

    <div class="navbar-center">
        <span id="clock"></span>
    </div>

    <div class="navbar-right">
        {% if user.is_authenticated %}
            <span class="navbar-user">{{ user }}</span>
            <form action="{% url 'logout' %}" method="post" class="navbar-form">
                {% csrf_token %}
                <button type="submit" class="navbar-btn">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="navbar-btn">Login</a>
            <a href="{% url 'register' %}" class="navbar-btn">Register</a>
        {% endif %}
    </div>
</nav>

<style>
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 24px;
        background-color: #1a1a2e;
        color: #eaeaea;
        font-family: sans-serif;
    }
    .navbar-brand {
        color: #eaeaea;
        font-weight: bold;
        font-size: 1.3em;
        text-decoration: none;
    }
    .navbar-center {
        font-size: 0.95em;
        opacity: 0.8;
    }
    .navbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .navbar-user {
        opacity: 0.9;
    }
    .navbar-form {
        display: inline;
    }
    .navbar-btn {
        background: none;
        border: 1px solid #eaeaea;
        color: #eaeaea;
        padding: 6px 14px;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9em;
    }
    .navbar-btn:hover {
        background-color: #eaeaea;
        color: #1a1a2e;
    }
</style>

<script>
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        const dateStr = now.toLocaleDateString('fr-FR', options);
        const timeStr = now.toLocaleTimeString('fr-FR');
        document.getElementById('clock').textContent = `${dateStr} — ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>
