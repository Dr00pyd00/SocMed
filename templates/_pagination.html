


 {# templates/_pagination.html #}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="pagination-arrow">←</a>
    {% else %}
        <span class="pagination-arrow is-disabled">←</span>
    {% endif %}

    <span class="pagination-status">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="pagination-arrow">→</a>
    {% else %}
        <span class="pagination-arrow is-disabled">→</span>
    {% endif %}
</nav>
